# IMPORTANT: this filename is registered in the nuget.org Trusted Publishing
# policy. Renaming or moving this file breaks publishing until the policy is
# updated. Keep it as release.yml across every repository.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build and test first, and publish the exact artifact that was tested
  # rather than rebuilding in the publish job.
  build:
    name: Build, test & pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # MinVer reads the tag from here

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Test
        run: >
          dotnet test --no-build -c Release
          -- --report-trx --coverage --coverage-output-format cobertura
      - run: dotnet pack --no-build -c Release -o artifacts

      - name: Show what will be published
        run: ls -la artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*

  publish:
    name: Publish to NuGet.org
    needs: build
    runs-on: ubuntu-latest
    environment: nuget-release   # must match the Trusted Publishing policy
    permissions:
      contents: write            # create the GitHub Release
      id-token: write            # request the GitHub OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Log in immediately before pushing: the temporary key is short-lived
      # (about an hour) and each OIDC token can only be exchanged once.
      - name: NuGet login (OIDC to temporary key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, NOT an email

      - name: Push package
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

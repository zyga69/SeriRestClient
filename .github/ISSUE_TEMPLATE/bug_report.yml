name: Bug report
description: Report something that is not working
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal code sample is worth more than a description.
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "1.2.3"
    validations:
      required: true

  - type: input
    id: dotnet-version
    attributes:
      label: .NET version
      placeholder: "10.0.100"
    validations:
      required: false
